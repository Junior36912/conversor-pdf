# Blueprint do Render: publica o site como Static Site (sem servidor Node).
# O `next build` gera a pasta `out/` (output: "export" em next.config.ts); o Render só a serve.
#
# ATENÇÃO: este arquivo segue a documentação do Render, mas o deploy real ainda não foi testado.
# A versão do Node vem de `.node-version` (22). O `npm install` fica explícito no comando de build
# para não depender da instalação automática de dependências do Render.
services:
  - type: web
    name: pdflocal
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    # Arquivos de /_next/static/ têm hash de conteúdo no nome e o worker do pdf.js leva a versão no nome:
    # nunca mudam, então podem ficar em cache para sempre. Sem isto o Render responde `max-age=0` e o
    # navegador revalida cada chunk a cada worker novo (uma ida e volta por arquivo).
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /pdf.worker.*
        name: Cache-Control
        value: public, max-age=31536000, immutable
